name = "mahoraga-owner-gateway"
main = "worker.mjs"
compatibility_date = "2026-09-01"

[vars]
MAHORAGA_RUNTIME_ORIGIN = "https://mahoraga-execution-runtime.mahoraga-mjw0123.workers.dev/"
MAHORAGA_PAGES_ORIGIN = "https://michaeljwilliams0123.github.io/"

[[services]]
binding = "MAHORAGA_EXECUTION_RUNTIME"
service = "mahoraga-execution-runtime"

[secrets]
required = ["MAHORAGA_CLOUD_OWNER_ID", "MAHORAGA_CLOUD_OWNER_ASSERTION_SECRET"]
