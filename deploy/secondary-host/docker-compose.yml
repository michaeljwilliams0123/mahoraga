name: mahoraga-secondary-operations

# SECONDARY MACHINE ONLY.
# Never run this stack on the protected primary device.
# Every image must be supplied as an immutable digest, for example
# registry.example/image@sha256:<64 lowercase hex characters>.

x-operations-defaults: &operations-defaults
  restart: unless-stopped
  networks:
    - operations
  security_opt:
    - no-new-privileges:true

x-health-defaults: &health-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 20s

x-http-healthcheck: &http-healthcheck
  <<: *health-defaults
  test:
    - CMD-SHELL
    - >-
      (command -v wget >/dev/null 2>&1 && wget -qO- http://127.0.0.1:$${HEALTHCHECK_PORT:-80}$${HEALTHCHECK_PATH:-/} >/dev/null)
      ||
      (command -v curl >/dev/null 2>&1 && curl -fsS http://127.0.0.1:$${HEALTHCHECK_PORT:-80}$${HEALTHCHECK_PATH:-/} >/dev/null)

x-ollama-service: &ollama-service
  <<: *operations-defaults
  image: ${OLLAMA_IMAGE:?set OLLAMA_IMAGE to an immutable image digest}
  networks:
    - operations
    - model-egress
  environment:
    OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
  volumes:
    - ollama_data:/root/.ollama
  expose:
    - "11434"
  healthcheck:
    <<: *health-defaults
    test:
      - CMD
      - ollama
      - list

services:
  env-init:
    image: ${ENV_INIT_IMAGE:?set ENV_INIT_IMAGE to an immutable image digest}
    command:
      - /bin/sh
      - -ceu
      - |
        test -n "$N8N_ENCRYPTION_KEY"
        test -n "$QDRANT_API_KEY"
        test -n "$MCP_ALLOWED_SERVERS"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?inject outside Git}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?inject outside Git}
      MCP_ALLOWED_SERVERS: ${MCP_ALLOWED_SERVERS:?set a bounded server allowlist}
    networks:
      - operations
    restart: "no"

  qdrant:
    <<: *operations-defaults
    image: ${QDRANT_IMAGE:?set QDRANT_IMAGE to an immutable image digest}
    depends_on:
      env-init:
        condition: service_completed_successfully
    ports:
      - "${QDRANT_BIND_HOST:-127.0.0.1}:6333:6333"
      - "${QDRANT_BIND_HOST:-127.0.0.1}:6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?inject outside Git}
      QDRANT__TELEMETRY_DISABLED: "true"
      HEALTHCHECK_PORT: "6333"
      HEALTHCHECK_PATH: "/healthz"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck: *http-healthcheck

  n8n:
    <<: *operations-defaults
    image: ${N8N_IMAGE:?set N8N_IMAGE to an immutable image digest}
    depends_on:
      env-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    ports:
      - "${N8N_BIND_HOST:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      N8N_HOST: ${N8N_HOST:-127.0.0.1}
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?inject outside Git}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_METRICS: "true"
      N8N_AI_OLLAMA_URL: ${N8N_AI_OLLAMA_URL:-http://host.docker.internal:11434}
      HEALTHCHECK_PORT: "5678"
      HEALTHCHECK_PATH: "/healthz"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/seed:ro
    healthcheck: *http-healthcheck

  n8n-import:
    <<: *operations-defaults
    image: ${N8N_IMAGE:?set N8N_IMAGE to an immutable image digest}
    depends_on:
      n8n:
        condition: service_healthy
    command:
      - /bin/sh
      - -ceu
      - |
        if [ "${N8N_IMPORT_ON_BOOT:-false}" != "true" ]; then
          echo "n8n import skipped"
          exit 0
        fi
        if [ ! -f /seed/uccp-event-monitor.json ]; then
          echo "seed workflow missing"
          exit 1
        fi
        n8n import:workflow --input=/seed/uccp-event-monitor.json
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?inject outside Git}
      N8N_IMPORT_ON_BOOT: ${N8N_IMPORT_ON_BOOT:-false}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/seed:ro
    restart: "no"

  mcp-gateway:
    <<: *operations-defaults
    image: ${MCP_GATEWAY_IMAGE:?set MCP_GATEWAY_IMAGE to a reviewed immutable image digest}
    depends_on:
      env-init:
        condition: service_completed_successfully
      n8n:
        condition: service_healthy
    environment:
      GATEWAY_BIND: "0.0.0.0:8080"
      ALLOWED_SERVERS: ${MCP_ALLOWED_SERVERS:?set a bounded server allowlist}
      HEALTHCHECK_PORT: "8080"
      HEALTHCHECK_PATH: "${MCP_GATEWAY_HEALTH_PATH:-/healthz}"
    ports:
      - "${MCP_GATEWAY_BIND_HOST:-127.0.0.1}:${MCP_GATEWAY_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck: *http-healthcheck

  ollama-cpu:
    <<: *ollama-service
    profiles:
      - cpu
      - primary-cpu

  ollama-gpu-nvidia:
    <<: *ollama-service
    profiles:
      - gpu-nvidia
      - primary-gpu-nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  ollama-gpu-amd:
    <<: *ollama-service
    profiles:
      - gpu-amd
      - primary-gpu-amd
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video

  ollama-pull-cpu:
    <<: *operations-defaults
    image: ${OLLAMA_IMAGE:?set OLLAMA_IMAGE to an immutable image digest}
    profiles:
      - cpu
      - primary-cpu
    depends_on:
      env-init:
        condition: service_completed_successfully
      ollama-cpu:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ceu
      - |
        ollama pull "${OLLAMA_MODEL:-llama3.2}"
    environment:
      OLLAMA_HOST: "http://ollama-cpu:11434"
    restart: "no"

  ollama-pull-gpu-nvidia:
    <<: *operations-defaults
    image: ${OLLAMA_IMAGE:?set OLLAMA_IMAGE to an immutable image digest}
    profiles:
      - gpu-nvidia
      - primary-gpu-nvidia
    depends_on:
      env-init:
        condition: service_completed_successfully
      ollama-gpu-nvidia:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ceu
      - |
        ollama pull "${OLLAMA_MODEL:-llama3.2}"
    environment:
      OLLAMA_HOST: "http://ollama-gpu-nvidia:11434"
    restart: "no"

  ollama-pull-gpu-amd:
    <<: *operations-defaults
    image: ${OLLAMA_IMAGE:?set OLLAMA_IMAGE to an immutable image digest}
    profiles:
      - gpu-amd
      - primary-gpu-amd
    depends_on:
      env-init:
        condition: service_completed_successfully
      ollama-gpu-amd:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ceu
      - |
        ollama pull "${OLLAMA_MODEL:-llama3.2}"
    environment:
      OLLAMA_HOST: "http://ollama-gpu-amd:11434"
    restart: "no"

networks:
  operations:
    internal: true
  model-egress:

volumes:
  n8n_data:
  qdrant_data:
  ollama_data:
