name: Bounded Codex cloud task
description: Delegate repository-only work to Codex cloud for Primary review.
title: "[CODEX] "
labels:
  - codex:queued
  - privacy:repo-only
body:
  - type: markdown
    attributes:
      value: |
        @codex

        Use only this issue and repository contents. Do not access or export chats, credentials, personal files, browser history, plugin responses, or unrelated context. Open a pull request; do not merge or push directly to `main`.
  - type: input
    id: idempotency_key
    attributes:
      label: Idempotency key
      description: Stable identifier reused for retries of the same logical task.
      placeholder: mahoraga-feature-v1
    validations:
      required: true
  - type: input
    id: base_commit
    attributes:
      label: Base commit
      description: Full immutable commit SHA from which work must start.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Bounded task
      description: Describe the repository outcome without chat or personal context.
    validations:
      required: true
  - type: textarea
    id: allowed_paths
    attributes:
      label: Allowed paths
      description: One repository-relative path or directory per line.
      placeholder: |
        src
        test
        docs
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification commands
      description: One deterministic command per line.
      placeholder: npm run verify
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions the Primary Codex must verify before merge.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This task contains no chat transcript, credential, personal file, raw plugin response, or unrelated context.
          required: true
