name: contract-validation

# Zero-credit, offline schema validation. Invokes no model, uses no secrets.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "schemas/**"
      - "examples/**"
      - "tests/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python tests/validate_contract.py
