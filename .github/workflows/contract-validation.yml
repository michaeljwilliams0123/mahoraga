name: contract-validation

# Zero-credit, offline schema validation. Invokes no model, uses no secrets.
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "schemas/**"
      - "examples/**"
      - "tests/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python tests/validate_contract.py
