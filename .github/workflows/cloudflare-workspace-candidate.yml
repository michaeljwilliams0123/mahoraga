name: Publish Mahoraga Cloudflare Workspace Candidate

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy and Accept Exact Main on Cloudflare"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: mahoraga-cloudflare-workspace-candidate
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact verified main as a candidate UI
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner &&
       github.repository == 'michaeljwilliams0123/mahoraga' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.repository == 'michaeljwilliams0123/mahoraga' &&
       github.event.workflow_run.name == 'Deploy and Accept Exact Main on Cloudflare' &&
       github.event.workflow_run.path == '.github/workflows/cloudflare-execution-runtime.yml' &&
       github.event.workflow_run.status == 'completed' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       ((github.event.workflow_run.actor.login == github.repository_owner &&
         (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch')) ||
        (github.event.workflow_run.actor.login == 'github-actions[bot]' && github.event.workflow_run.event == 'workflow_run')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERIFIED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      NEXT_PUBLIC_MAHORAGA_BRIDGE_ORIGIN: https://mahoraga-owner-gateway.mahoraga-mjw0123.workers.dev
      MAHORAGA_DEPLOYMENT_PROVIDER: cloudflare-workers
      MAHORAGA_DEPLOYMENT_ENV: candidate
      MAHORAGA_DEPLOYMENT_URL: https://mahoraga-workspace-candidate.mahoraga-mjw0123.workers.dev
      MAHORAGA_GIT_COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      MAHORAGA_GIT_COMMIT_REF: main

    steps:
      - name: Check out exact verified main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Mahoraga Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Validate accepted runtime publication receipt
        if: github.event_name == 'workflow_run'
        run: node scripts/cloudflare-workspace-proof.ts

      - name: Verify exact SHA is still authoritative main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-exact-head.mjs

      - name: Require existing Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deployment credentials are unavailable."
            exit 1
          fi

      - name: Install the existing workspace dependencies
        working-directory: cloud-app
        run: npm ci --no-audit --no-fund

      - name: Typecheck and test the existing workspace
        working-directory: cloud-app
        run: npm run typecheck && npm run test

      - name: Build the root-path workspace candidate
        run: npm run cloudflare:workspace:build

      - name: Recheck authoritative main before publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-exact-head.mjs

      - name: Deploy static UI candidate
        run: npx --yes wrangler@4.132.0 deploy --config deploy/cloudflare-workspace/wrangler.jsonc

      - name: Verify static headers, exact UI build and paired runtime source
        run: node scripts/cloudflare-workspace-proof.ts accept reports/cloudflare-workspace-candidate-acceptance.json

      - name: Retain bounded workspace acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-workspace-candidate-${{ env.VERIFIED_SHA }}
          path: reports/cloudflare-workspace-candidate-acceptance.json
          retention-days: 7
          if-no-files-found: error
