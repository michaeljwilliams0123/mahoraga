name: Publish Mahoraga Cloudflare Workspace Candidate

on:
  workflow_run:
    workflows: ["Verify Mahoraga"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: mahoraga-cloudflare-workspace-candidate
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact verified main as a candidate UI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MAHORAGA_DEPLOYMENT_PROVIDER: cloudflare-workers
      MAHORAGA_DEPLOYMENT_ENV: candidate
      MAHORAGA_DEPLOYMENT_URL: https://mahoraga-workspace-candidate.mahoraga-mjw0123.workers.dev
      MAHORAGA_GIT_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
      MAHORAGA_GIT_COMMIT_REF: main

    steps:
      - name: Check out exact verified main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Mahoraga Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Verify exact SHA is still authoritative main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-exact-head.mjs

      - name: Require existing Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deployment credentials are unavailable."
            exit 1
          fi

      - name: Install the existing workspace dependencies
        working-directory: cloud-app
        run: npm ci --no-audit --no-fund

      - name: Build the root-path workspace candidate
        run: npm run cloudflare:workspace:build

      - name: Deploy static UI candidate
        run: npx --yes wrangler@4.132.0 deploy --config deploy/cloudflare-workspace/wrangler.jsonc

      - name: Verify browser URL and exact UI build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --output /tmp/mahoraga-ui.html "$MAHORAGA_DEPLOYMENT_URL/" &&
               curl --fail --silent --show-error --output /tmp/mahoraga-health.json "$MAHORAGA_DEPLOYMENT_URL/api/health.json" &&
               node -e 'const fs = require("node:fs"); const html = fs.readFileSync("/tmp/mahoraga-ui.html", "utf8"); const health = JSON.parse(fs.readFileSync("/tmp/mahoraga-health.json", "utf8")); if (!html.includes("/_next/static/") || health.deployment.provider !== "cloudflare-workers" || health.deployment.commitSha !== process.env.VERIFIED_SHA || health.deployment.promotion !== "unverified-cloudflare-static") process.exit(1);'; then
              echo "Candidate UI verified at $MAHORAGA_DEPLOYMENT_URL for $VERIFIED_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 10 ]; then sleep 3; fi
          done
          echo "::error::Cloudflare candidate did not serve the exact UI build after propagation retries."
          exit 1
