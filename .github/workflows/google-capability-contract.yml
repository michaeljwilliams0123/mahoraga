name: Google Capability Contract

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: google-capability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Verify release baseline
        run: node scripts/create-release-baseline.mjs --verify
      - name: Run Google, Chrome, and browser-boundary contracts
        run: node --test --test-isolation=none test/google-workspace-signed-chrome.test.mjs test/browser-cdp.test.mjs test/microsoft365-worker.test.mjs test/workspace-operations.test.mjs
