name: Publish Staged Mahoraga Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        default: beta
        options:
          - beta
          - stable
  workflow_run:
    workflows: ["Verify Mahoraga"]
    types: [completed]

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: mahoraga-release-hosted-v2-${{ github.event_name == 'workflow_run' && 'automatic' || inputs.channel }}
  cancel-in-progress: true

jobs:
  release:
    name: Attest and publish exact verified update
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' ||
        (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.actor.login == 'github-actions[bot]')))
    # Exact-SHA release packaging is portable and intentionally uses hosted Linux during cloud migration.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERIFIED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Mahoraga Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Fetch trusted bot publication receipt
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.actor.login == 'github-actions[bot]' &&
          github.event.workflow_run.event == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$PUBLICATION_VERIFY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          artifacts_json="$RUNNER_TEMP/verified-main-publication-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLICATION_VERIFY_RUN_ID/artifacts?per_page=100" > "$artifacts_json"
          artifact_name="verified-main-publication-$VERIFIED_SHA"
          artifact_count="$(jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' "$artifacts_json")"
          test "$artifact_count" = "1"
          artifact_id="$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name == $name and .expired == false) | .id' "$artifacts_json")"
          receipt_zip="$RUNNER_TEMP/verified-main-publication.zip"
          receipt_path="$RUNNER_TEMP/verified-main-publication.json"
          gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$receipt_zip"
          unzip -p "$receipt_zip" verified-main-publication.json > "$receipt_path"
          echo "VERIFIED_MAIN_PUBLICATION_RECEIPT=$receipt_path" >> "$GITHUB_ENV"

      - name: Validate canonical verification publication receipt
        if: github.event_name == 'workflow_run'
        run: node scripts/verified-main-publication.ts

      - name: Verify automatic release SHA is still current main
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-exact-head.mjs

      - name: Verify authoritative release source
        if: github.event_name == 'workflow_dispatch'
        run: npm run verify

      - name: Build immutable update archive and manifest
        id: package
        shell: bash
        env:
          CHANNEL: ${{ github.event_name == 'workflow_run' && 'beta' || inputs.channel }}
        run: |
          set -euo pipefail
          base_version="$(node -p 'require("./mahoraga.manifest.json").version')"
          release_base="${base_version%%-*}"
          if [ "$CHANNEL" = "stable" ]; then version="$base_version"; else version="${release_base}-beta.${GITHUB_RUN_NUMBER}"; fi
          tag="v${version}"
          commit="$(git rev-parse HEAD)"
          mkdir -p dist
          artifact="dist/mahoraga-${version}.zip"
          relay_artifact="dist/mahoraga-relay-${version}.zip"
          git archive --format=zip --prefix="mahoraga-${version}/" --output="$artifact" "$commit"
          git archive --format=zip --prefix="mahoraga-relay-${version}/" --output="$relay_artifact" "$commit" relay/core.mjs relay/cloudflare-worker.mjs relay/wrangler.toml docs/DESTINY-CODEX-RELAY.md
          node scripts/update-manifest.mjs create \
            --artifact "$artifact" \
            --version "$version" \
            --channel "$CHANNEL" \
            --tag "$tag" \
            --commit "$commit" \
            --output dist/mahoraga-update.json
          node scripts/update-manifest.mjs validate --file dist/mahoraga-update.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "relay_artifact=$relay_artifact" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Attest release provenance
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.relay_artifact }}
            dist/mahoraga-update.json

      - name: Publish staged GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.event_name == 'workflow_run' && 'beta' || inputs.channel }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
          RELAY_ARTIFACT: ${{ steps.package.outputs.relay_artifact }}
          COMMIT: ${{ steps.package.outputs.commit }}
        run: node scripts/publish-github-release.mjs
