name: Export Mahoraga Workspace to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mahoraga-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish optional cloud-app static export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloud-app/package-lock.json

      - name: Install workspace dependencies
        working-directory: cloud-app
        run: npm ci

      - name: Build optional static workspace export
        working-directory: cloud-app
        env:
          MAHORAGA_PAGES_EXPORT: "1"
          MAHORAGA_DEPLOYMENT_PROVIDER: github-pages
          MAHORAGA_DEPLOYMENT_ENV: production
          MAHORAGA_DEPLOYMENT_URL: https://michaeljwilliams0123.github.io/mahoraga/
          NEXT_PUBLIC_MAHORAGA_API_ORIGIN: ${{ vars.MAHORAGA_API_ORIGIN }}
          MAHORAGA_GIT_COMMIT_SHA: ${{ github.sha }}
          MAHORAGA_GIT_COMMIT_REF: main
        run: node ../scripts/build-pages-static.mjs

      - name: Check Pages site availability
        id: pages_site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          http_code="$(curl -sS -o /tmp/pages-site.json -w '%{http_code}' \
            -u "x-access-token:${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api_url}")"

          case "${http_code}" in
            200)
              echo "available=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "::warning::Pages site is not enabled for ${GITHUB_REPOSITORY}; skipping Pages deployment."
              echo "available=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::Unable to determine Pages site status (HTTP ${http_code})."
              cat /tmp/pages-site.json
              exit 1
              ;;
          esac

      - name: Configure Pages
        if: steps.pages_site.outputs.available == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload workspace artifact
        if: steps.pages_site.outputs.available == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: cloud-app/out

      - name: Publish exact-main static export
        if: steps.pages_site.outputs.available == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
