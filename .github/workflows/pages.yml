name: Export Mahoraga Workspace to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mahoraga-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and inspect static workspace
    runs-on: ${{ fromJSON(vars.MAHORAGA_PAGES_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out current revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install workspace dependencies
        working-directory: cloud-app
        run: npm ci

      - name: Typecheck workspace
        working-directory: cloud-app
        run: npm run typecheck

      - name: Test workspace
        working-directory: cloud-app
        run: node --test test/*.test.mjs

      - name: Build and inspect static workspace
        working-directory: cloud-app
        env:
          MAHORAGA_PAGES_EXPORT: "1"
          MAHORAGA_DEPLOYMENT_PROVIDER: github-pages
          MAHORAGA_DEPLOYMENT_ENV: production
          MAHORAGA_DEPLOYMENT_URL: https://michaeljwilliams0123.github.io/mahoraga/
          NEXT_PUBLIC_HEALTH_ENDPOINT: /mahoraga/api/health.json
          MAHORAGA_GIT_COMMIT_SHA: ${{ github.sha }}
          MAHORAGA_GIT_COMMIT_REF: main
        run: node ../scripts/build-pages-static.mjs

      - name: Upload workspace artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: cloud-app/out

  deploy:
    name: Publish exact-main static workspace
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ${{ fromJSON(vars.MAHORAGA_PAGES_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages site availability
        id: pages_site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          http_code="$(curl -sS -o /tmp/pages-site.json -w '%{http_code}' \
            -u "x-access-token:${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api_url}")"

          case "${http_code}" in
            200)
              echo "available=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "::warning::Pages site is not enabled for ${GITHUB_REPOSITORY}; skipping Pages deployment."
              echo "available=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "::error::Unable to determine Pages site status (HTTP ${http_code})."
              cat /tmp/pages-site.json
              exit 1
              ;;
          esac

      - name: Configure Pages
        if: steps.pages_site.outputs.available == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Publish exact-main static export
        if: steps.pages_site.outputs.available == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
