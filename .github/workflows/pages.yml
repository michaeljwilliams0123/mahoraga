name: Deploy Mahoraga Workspace to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mahoraga-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy current cloud-app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloud-app/package-lock.json

      - name: Install workspace dependencies
        working-directory: cloud-app
        run: npm ci

      - name: Build the single workspace for Pages
        working-directory: cloud-app
        env:
          MAHORAGA_PAGES_EXPORT: "1"
          MAHORAGA_DEPLOYMENT_PROVIDER: github-pages
          MAHORAGA_DEPLOYMENT_ENV: production
          MAHORAGA_DEPLOYMENT_URL: https://michaeljwilliams0123.github.io/mahoraga/
          MAHORAGA_GIT_COMMIT_SHA: ${{ github.sha }}
          MAHORAGA_GIT_COMMIT_REF: main
          NEXT_PUBLIC_HEALTH_ENDPOINT: /mahoraga/api/health
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload workspace artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: cloud-app/out

      - name: Deploy exact main workspace
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
