name: Sovereign Four Hour Candidate Cycle

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: Candidate branch to inspect
        required: false
        default: main

permissions:
  contents: read
  actions: read

jobs:
  candidate-cycle:
    if: github.event_name == 'schedule' || github.actor == 'michaeljwilliams0123'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Dry-run zero-credit candidate cycle
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node src/cloud-cycle-worker.mjs
