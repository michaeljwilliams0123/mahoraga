name: Sovereign Four Hour Candidate Cycle

on:
  workflow_run:
    workflows:
      - Publish Staged Mahoraga Update
    types:
      - completed
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: Candidate branch to inspect
        required: false
        default: main
      force:
        description: Re-run the current anchored window even if it is already complete
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: sovereign-four-hour-${{ github.repository }}
  cancel-in-progress: false

env:
  SOVEREIGN_ANCHOR_PREFIX: sovereign-cycle-anchor-v2-
  SOVEREIGN_COMPLETE_PREFIX: sovereign-cycle-complete-v2-
  SOVEREIGN_PRODUCER_SMOKE_TAG: sovereign-producer-smoke-v1

jobs:
  candidate-cycle:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'michaeljwilliams0123') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out trusted target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Resolve durable cadence anchor
        id: cadence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED_AT: ${{ github.event.workflow_run.updated_at }}
          RELEASED_SHA: ${{ github.event.workflow_run.head_sha }}
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --prune

          current_main="$(git rev-parse origin/main)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" && -n "${RELEASED_SHA:-}" && "${RELEASED_SHA}" != "${current_main}" ]]; then
            echo "Released SHA ${RELEASED_SHA} is no longer current main ${current_main}; refusing to anchor stale production."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          anchor_tag="$(git tag --list "${SOVEREIGN_ANCHOR_PREFIX}*" --sort=-refname | head -n 1)"
          created_anchor=false

          if [[ -z "${anchor_tag}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_run" || -z "${RELEASED_AT:-}" ]]; then
              echo "No durable cadence anchor exists yet; heartbeat exits without work."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            anchor_iso="$(node --input-type=module -e 'import { createDeploymentAnchor } from "./src/sovereign-cycle-clock.mjs"; console.log(createDeploymentAnchor(process.argv[1]));' "${RELEASED_AT}")"
            anchor_epoch="$(node --input-type=module -e 'import { getAnchorEpoch } from "./src/sovereign-cycle-clock.mjs"; console.log(getAnchorEpoch(process.argv[1]));' "${anchor_iso}")"
            anchor_tag="${SOVEREIGN_ANCHOR_PREFIX}${anchor_epoch}"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${anchor_tag}" \
              -f sha="${current_main}"
            created_anchor=true
            echo "Created durable cadence anchor ${anchor_tag} at ${anchor_iso}."
          else
            anchor_epoch="${anchor_tag#${SOVEREIGN_ANCHOR_PREFIX}}"
            anchor_iso="$(node --input-type=module -e 'import { fromEpochSeconds } from "./src/sovereign-cycle-clock.mjs"; console.log(fromEpochSeconds(process.argv[1]));' "${anchor_epoch}")"
          fi

          if [[ "${created_anchor}" == "true" ]]; then
            now_epoch="$(date -u +%s)"
            wait_seconds="$((anchor_epoch - now_epoch))"
            if (( wait_seconds > 0 )); then
              echo "Production cadence test will start in ${wait_seconds}s at ${anchor_iso}."
              sleep "${wait_seconds}"
            fi
          fi

          now_iso="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          window_iso="$(node --input-type=module -e 'import { getAnchoredFourHourWindowStart } from "./src/sovereign-cycle-clock.mjs"; const value = getAnchoredFourHourWindowStart(process.argv[1], process.argv[2]); if (value) console.log(value);' "${now_iso}" "${anchor_iso}")"
          if [[ -z "${window_iso}" ]]; then
            echo "Cadence anchor ${anchor_iso} has not been reached."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          window_epoch="$(node --input-type=module -e 'import { getCycleWindowEpoch } from "./src/sovereign-cycle-clock.mjs"; console.log(getCycleWindowEpoch(process.argv[1]));' "${window_iso}")"
          complete_tag="${SOVEREIGN_COMPLETE_PREFIX}${window_epoch}"
          if git show-ref --tags --verify --quiet "refs/tags/${complete_tag}" && [[ "${FORCE_RUN}" != "true" ]]; then
            echo "Window ${window_iso} already completed as ${complete_tag}; duplicate heartbeat suppressed."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "anchor_iso=${anchor_iso}" >> "$GITHUB_OUTPUT"
          echo "window_iso=${window_iso}" >> "$GITHUB_OUTPUT"
          echo "window_epoch=${window_epoch}" >> "$GITHUB_OUTPUT"
          echo "complete_tag=${complete_tag}" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Credit-free heartbeat preflight
        if: steps.cadence.outputs.should_run == 'true'
        id: heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ledger=""
          if [[ -n "${GH_TOKEN:-}" && -n "${GITHUB_REPOSITORY:-}" ]]; then
            ledger="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments?sort=updated&direction=desc&per_page=30" --jq '[.[].body] | join("\n")' || true)"
          fi
          if echo "${ledger}" | grep -q 'api-deployments-free-per-day'; then
            export MAHORAGA_HOSTED_LEDGER_TEXT='code: "api-deployments-free-per-day"'
          else
            export MAHORAGA_HOSTED_LEDGER_TEXT=""
          fi
          output="$(node src/autonomy-heartbeat.mjs)"
          echo "${output}"
          action="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.nextAction);' "${output}")"
          cost="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(String(value.creditCost));' "${output}")"
          paid="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(String(value.paidFallback));' "${output}")"
          reason="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.hostedCompute?.reason || "");' "${output}")"
          used="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(String(value.hostedCompute?.used ?? 0));' "${output}")"
          echo "next_action=${action}" >> "$GITHUB_OUTPUT"
          echo "hosted_used=${used}" >> "$GITHUB_OUTPUT"
          {
            echo "## Credit-free heartbeat"
            echo "- nextAction: \`${action}\`"
            echo "- hostedCompute: \`${reason}\`"
            echo "- creditCost: \`${cost}\`"
            echo "- paidFallback: \`${paid}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${cost}" != "0" || "${paid}" != "false" ]]; then
            echo "Heartbeat contaminated a paid route; refusing." >&2
            exit 1
          fi
          if [[ "${action}" == "refuse-paid-route" ]]; then
            echo "Credit-free heartbeat refused a paid route." >&2
            exit 1
          fi
          if [[ "${action}" == "hold-planned" ]]; then
            echo "Credit-free heartbeat held planned; cycle will not buy a route."
          fi

      - name: Run anchored zero-credit candidate cycle
        id: cycle
        if: >-
          steps.cadence.outputs.should_run == 'true' &&
          steps.heartbeat.outputs.next_action != 'hold-planned'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAHORAGA_CYCLE_ANCHOR_UTC: ${{ steps.cadence.outputs.anchor_iso }}
          MAHORAGA_CANDIDATE_PRODUCER: github-native
          MAHORAGA_VERCEL_DEPLOYMENTS_TODAY: ${{ steps.heartbeat.outputs.hosted_used }}
        shell: bash
        run: |
          set -euo pipefail
          stderr_file="${RUNNER_TEMP}/cycle.stderr"
          set +e
          output="$(node src/cloud-cycle-worker.mjs 2>"${stderr_file}")"
          node_rc=$?
          set -e
          if [[ -s "${stderr_file}" ]]; then
            echo "Sovereign worker emitted stderr; safe terminal metadata is reported in the JSON receipt." >&2
          fi
          if [[ -z "${output}" ]]; then
            echo "Sovereign worker exited without a JSON receipt (node_rc=${node_rc})." >&2
            exit "${node_rc:-1}"
          fi
          echo "${output}"
          status="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.status);' "${output}")"
          window="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.windowStartUtc || "");' "${output}")"
          terminal_reason="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.terminalReason || "");' "${output}")"
          terminal_stage="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.terminalStage || "");' "${output}")"
          terminal_detail="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.terminalDetail || "");' "${output}")"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "window=${window}" >> "$GITHUB_OUTPUT"
          echo "terminal_reason=${terminal_reason}" >> "$GITHUB_OUTPUT"
          echo "terminal_stage=${terminal_stage}" >> "$GITHUB_OUTPUT"
          echo "terminal_detail=${terminal_detail}" >> "$GITHUB_OUTPUT"
          if [[ "${node_rc}" -ne 0 || "${status}" == "failed" ]]; then
            exit 1
          fi

      - name: Mark durable window complete
        if: >-
          steps.cadence.outputs.should_run == 'true' &&
          (steps.cycle.outputs.status == 'no-candidate' || steps.cycle.outputs.status == 'candidate-ready')
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETE_TAG: ${{ steps.cadence.outputs.complete_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          head_sha="$(git rev-parse origin/main)"
          if git show-ref --tags --verify --quiet "refs/tags/${COMPLETE_TAG}"; then
            echo "Completion tag ${COMPLETE_TAG} already exists."
            exit 0
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${COMPLETE_TAG}" \
            -f sha="${head_sha}"
          echo "Marked anchored window complete as ${COMPLETE_TAG}."

  producer-smoke:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out deployed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Arm one-time producer smoke ten minutes after deployment
        id: smoke
        env:
          RELEASED_AT: ${{ github.event.workflow_run.updated_at }}
          RELEASED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --prune
          current_main="$(git rev-parse origin/main)"
          if [[ "${RELEASED_SHA}" != "${current_main}" ]]; then
            echo "Released SHA ${RELEASED_SHA} is no longer current main ${current_main}; smoke is stale."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git show-ref --tags --verify --quiet "refs/tags/${SOVEREIGN_PRODUCER_SMOKE_TAG}"; then
            echo "Producer smoke already completed as ${SOVEREIGN_PRODUCER_SMOKE_TAG}."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          smoke_at="$(node --input-type=module -e 'import { createDeploymentAnchor } from "./src/sovereign-cycle-clock.mjs"; console.log(createDeploymentAnchor(process.argv[1]));' "${RELEASED_AT}")"
          smoke_epoch="$(node --input-type=module -e 'import { getAnchorEpoch } from "./src/sovereign-cycle-clock.mjs"; console.log(getAnchorEpoch(process.argv[1]));' "${smoke_at}")"
          now_epoch="$(date -u +%s)"
          wait_seconds="$((smoke_epoch - now_epoch))"
          if (( wait_seconds > 0 )); then
            echo "Sovereign producer smoke will scan for an update/enhancement in ${wait_seconds}s at ${smoke_at}."
            sleep "${wait_seconds}"
          fi
          echo "smoke_at=${smoke_at}" >> "$GITHUB_OUTPUT"
          echo "released_sha=${RELEASED_SHA}" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Scan and produce bounded enhancement candidate
        id: producer
        if: steps.smoke.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MAHORAGA_CYCLE_ANCHOR_UTC: ${{ steps.smoke.outputs.smoke_at }}
          MAHORAGA_CANDIDATE_PRODUCER: github-native
        shell: bash
        run: |
          set -euo pipefail
          stderr_file="${RUNNER_TEMP}/cycle.stderr"
          set +e
          output="$(node src/cloud-cycle-worker.mjs 2>"${stderr_file}")"
          node_rc=$?
          set -e
          if [[ -s "${stderr_file}" ]]; then
            echo "Sovereign worker emitted stderr; safe terminal metadata is reported in the JSON receipt." >&2
          fi
          if [[ -z "${output}" ]]; then
            echo "Sovereign worker exited without a JSON receipt (node_rc=${node_rc})." >&2
            exit "${node_rc:-1}"
          fi
          echo "${output}"
          status="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.status);' "${output}")"
          terminal_reason="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.terminalReason || "");' "${output}")"
          terminal_stage="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.terminalStage || "");' "${output}")"
          terminal_detail="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.terminalDetail || "");' "${output}")"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "terminal_reason=${terminal_reason}" >> "$GITHUB_OUTPUT"
          echo "terminal_stage=${terminal_stage}" >> "$GITHUB_OUTPUT"
          echo "terminal_detail=${terminal_detail}" >> "$GITHUB_OUTPUT"
          if [[ "${node_rc}" -ne 0 || "${status}" == "failed" ]]; then
            exit 1
          fi

      - name: Mark producer smoke complete
        if: >-
          steps.smoke.outputs.should_run == 'true' &&
          (steps.producer.outputs.status == 'no-candidate' || steps.producer.outputs.status == 'candidate-ready')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED_SHA: ${{ steps.smoke.outputs.released_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/${SOVEREIGN_PRODUCER_SMOKE_TAG}"; then
            echo "Producer smoke tag already exists."
            exit 0
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${SOVEREIGN_PRODUCER_SMOKE_TAG}" \
            -f sha="${RELEASED_SHA}"
          echo "Marked producer smoke complete as ${SOVEREIGN_PRODUCER_SMOKE_TAG}."
