name: Steward Two Hour Learning

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: steward-two-hour-learning-${{ github.repository }}
  cancel-in-progress: false

jobs:
  learn:
    # Owner-selectable repo routing: auto (default), cloud, local, hold.
    # Public may use only free hosted Ubuntu; private may use only owner-enabled
    # local Windows. Unknown/unsupported modes hold before runner allocation.
    if: >-
      (github.event_name == 'schedule' || github.actor == 'michaeljwilliams0123') &&
      ((github.event.repository.private == false &&
        (vars.MAHORAGA_EXECUTION_ROUTE == '' ||
         vars.MAHORAGA_EXECUTION_ROUTE == 'auto' ||
         vars.MAHORAGA_EXECUTION_ROUTE == 'cloud')) ||
       (github.event.repository.private == true &&
        vars.MAHORAGA_PRIVATE_STEWARD_LOCAL_ENABLED == 'true' &&
        (vars.MAHORAGA_EXECUTION_ROUTE == '' ||
         vars.MAHORAGA_EXECUTION_ROUTE == 'auto' ||
         vars.MAHORAGA_EXECUTION_ROUTE == 'local')))
    runs-on: ${{ fromJSON(github.event.repository.private && '["self-hosted","windows","x64","mahoraga","zero-credit"]' || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - name: Mint existing repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MAHORAGA_GITHUB_APP_ID }}
          private-key: ${{ secrets.MAHORAGA_GITHUB_APP_PRIVATE_KEY }}
          repositories: mahoraga
          permission-contents: write
          permission-pull-requests: write

      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Use Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'

      - name: Refresh deterministic steward state and foundry
        id: learn
        shell: bash
        run: |
          set -euo pipefail
          node scripts/steward-learning-cycle.mjs
          node scripts/steward-agent-foundry.mjs
          node scripts/steward-learning-cycle.mjs
          if git diff --quiet -- coordination/agent-factory/registry.json reports/steward-learning-state.json reports/steward-feat-ledger.json reports/steward-agent-factory.json reports/steward-agent-foundry-applied.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful learning-state or agent-foundry change detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open bounded learning-state pull request
        if: steps.learn.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="feature/sovereign-steward-learning-${GITHUB_RUN_ID}"
          pr_url="$(gh pr list --base main --head "${branch}" --state all --limit 1 --json url --jq '.[0].url // empty')"
          if [[ -n "${pr_url}" ]]; then
            echo "Reusing pull request: ${pr_url}"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            pr_url="$(gh pr create --draft --base main --head "${branch}" --title "chore: refresh steward learning state" --body "Deterministic two-hour Mahoraga Steward state refresh and bounded permanent-agent foundry update. Zero paid-model/API inference. No Windows activation.")"
            echo "Opened pull request from retained branch: ${pr_url}"
            exit 0
          fi
          git switch -c "${branch}"
          git add -A coordination/agent-factory/registry.json reports/steward-*.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: refresh steward learning state"
          git push origin "HEAD:${branch}"
          pr_url="$(gh pr create --draft --base main --head "${branch}" --title "chore: refresh steward learning state" --body "Deterministic two-hour Mahoraga Steward state refresh and bounded permanent-agent foundry update. Zero paid-model/API inference. No Windows activation.")"
          pr_number="${pr_url##*/}"
          echo "Opened PR #${pr_number}: ${pr_url}"
