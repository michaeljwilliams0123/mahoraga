name: Steward Two Hour Learning

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: steward-two-hour-learning-${{ github.repository }}
  cancel-in-progress: false

jobs:
  learn:
    if: github.event_name == 'schedule' || github.actor == 'michaeljwilliams0123'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Refresh deterministic steward state and foundry
        id: learn
        shell: bash
        run: |
          set -euo pipefail
          node scripts/steward-learning-cycle.mjs
          node scripts/steward-agent-foundry.mjs
          node scripts/steward-learning-cycle.mjs
          if git diff --quiet -- coordination/agent-factory/registry.json reports/steward-learning-state.json reports/steward-feat-ledger.json reports/steward-agent-factory.json reports/steward-agent-foundry-applied.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful learning-state or agent-foundry change detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open bounded learning-state pull request
        if: steps.learn.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="feature/sovereign-steward-learning-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add -A coordination/agent-factory/registry.json reports/steward-*.json
          git commit -m "chore: refresh steward learning state"
          git push origin "HEAD:${branch}"
          pr_url="$(gh pr create --base main --head "${branch}" --title "chore: refresh steward learning state" --body "Deterministic two-hour Mahoraga Steward state refresh and bounded permanent-agent foundry update. Zero paid-model/API inference. No Windows activation.")"
          pr_number="${pr_url##*/}"
          echo "Opened PR #${pr_number}: ${pr_url}"
          gh workflow run verify.yml --ref "${branch}"
