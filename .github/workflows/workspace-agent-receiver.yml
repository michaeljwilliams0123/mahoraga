name: Receive Workspace Agent Assignment

on:
  push:
    branches: [main]
    paths:
      - "coordination/assignments/*.json"
  workflow_dispatch:
    inputs:
      assignment_id:
        description: Existing bounded secondary assignment ID
        required: true
        type: string
      route_policy:
        description: destiny-workspace, mike-primary, balanced, or overflow
        required: false
        default: balanced
        type: choice
        options: [destiny-workspace, mike-primary, balanced, overflow]

permissions:
  contents: read

concurrency:
  group: mahoraga-workspace-agent-${{ inputs.assignment_id || github.sha }}
  cancel-in-progress: false

jobs:
  receive:
    name: Validate and deliver one bounded assignment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out authoritative repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Mahoraga Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Validate and receive assignment
        shell: bash
        env:
          DESTINY_WORKSPACE_AGENT_ACCESS_TOKEN: ${{ secrets.DESTINY_WORKSPACE_AGENT_ACCESS_TOKEN }}
          DESTINY_WORKSPACE_AGENT_TRIGGER_ID: ${{ secrets.DESTINY_WORKSPACE_AGENT_TRIGGER_ID }}
          DESTINY_WORKSPACE_RECEIPT_PUBLIC_KEY_SPKI: ${{ secrets.DESTINY_WORKSPACE_RECEIPT_PUBLIC_KEY_SPKI }}
          DESTINY_WORKSPACE_RECEIPT_PUBLIC_KEY_FINGERPRINT: ${{ vars.DESTINY_WORKSPACE_RECEIPT_PUBLIC_KEY_FINGERPRINT }}
          DESTINY_WORKSPACE_RECEIPT_KEY_ID: ${{ vars.DESTINY_WORKSPACE_RECEIPT_KEY_ID }}
          MIKE_PRIMARY_AGENT_ACCESS_TOKEN: ${{ secrets.MIKE_PRIMARY_AGENT_ACCESS_TOKEN }}
          MIKE_PRIMARY_WORKSPACE_AGENT_TRIGGER_ID: ${{ secrets.MIKE_PRIMARY_WORKSPACE_AGENT_TRIGGER_ID }}
          MIKE_PRIMARY_METERED: ${{ vars.MIKE_PRIMARY_METERED }}
          ROUTE_POLICY: ${{ inputs.route_policy }}
        run: |
          set -euo pipefail
          node scripts/workspace-agent-receiver.mjs receive --event-file "$GITHUB_EVENT_PATH" \
            | tee "$RUNNER_TEMP/workspace-agent-receiver.json"

      - name: Record bounded receiver state
        if: always()
        shell: bash
        env:
          RESULT_FILE: ${{ runner.temp }}/workspace-agent-receiver.json
        run: |
          node -e '
            const fs = require("node:fs");
            let state = "failed-before-receipt";
            let assignment = "none";
            try {
              const result = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, "utf8"));
              state = result.state;
              assignment = result.assignmentId ?? "none";
            } catch {}
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Workspace Agent receiver\n\n- Assignment: \`${assignment}\`\n- State: \`${state}\`\n- Content boundary: repository task metadata only\n`);
          '
