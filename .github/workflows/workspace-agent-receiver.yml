name: Receive Workspace Agent Assignment

on:
  push:
    branches: [main]
    paths:
      - "coordination/assignments/*.json"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      assignment_id:
        description: Existing bounded secondary assignment ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mahoraga-workspace-agent-${{ github.event.issue.number || inputs.assignment_id || github.sha }}
  cancel-in-progress: false

jobs:
  receive:
    name: Validate and deliver one bounded assignment
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request == null &&
       github.actor == github.repository_owner &&
       startsWith(github.event.comment.body, '/mahoraga receive workspace-agent '))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out authoritative repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Mahoraga Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Validate and receive assignment
        shell: bash
        env:
          AGENT_ACCESS_TOKEN: ${{ secrets.AGENT_ACCESS_TOKEN }}
          WORKSPACE_AGENT_TRIGGER_ID: ${{ secrets.WORKSPACE_AGENT_TRIGGER_ID }}
        run: |
          set -euo pipefail
          node scripts/workspace-agent-receiver.mjs receive --event-file "$GITHUB_EVENT_PATH" \
            | tee "$RUNNER_TEMP/workspace-agent-receiver.json"

      - name: Record bounded receiver state
        if: always()
        shell: bash
        env:
          RESULT_FILE: ${{ runner.temp }}/workspace-agent-receiver.json
        run: |
          node -e '
            const fs = require("node:fs");
            let state = "failed-before-receipt";
            let assignment = "none";
            try {
              const result = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, "utf8"));
              state = result.state;
              assignment = result.assignmentId ?? "none";
            } catch {}
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Workspace Agent receiver\n\n- Assignment: \`${assignment}\`\n- State: \`${state}\`\n- Content boundary: repository task metadata only\n`);
          '
