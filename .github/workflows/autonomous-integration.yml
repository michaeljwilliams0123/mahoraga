name: Autonomous Integration

on:
  workflow_run:
    workflows: ["Verify Mahoraga", "Validate Destiny Codex Relay"]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_head_sha:
        description: Exact verified sovereign candidate head SHA
        required: true
        type: string
      candidate_head_branch:
        description: Exact verified sovereign candidate branch
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: mahoraga-autonomous-main-integration
  cancel-in-progress: false

jobs:
  evaluate:
    permissions:
      actions: read
      contents: read
      pull-requests: read
    if: >-
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (
          github.event.workflow_run.event == 'pull_request' ||
          (
            github.event.workflow_run.event == 'workflow_dispatch' &&
            startsWith(github.event.workflow_run.head_branch, 'feature/sovereign-')
          )
        )
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.candidate_head_sha != '' &&
        startsWith(inputs.candidate_head_branch, 'feature/sovereign-')
      )
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.candidate.outputs.found }}
      eligible: ${{ steps.policy.outputs.eligible }}
      reason: ${{ steps.policy.outputs.reason }}
      pull_request: ${{ steps.policy.outputs.pull_request }}
      head_sha: ${{ steps.policy.outputs.head_sha }}
    steps:
      - name: Checkout trusted policy from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Collect bounded candidate metadata
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { pathToFileURL } = require("url");
            const { latestExactWorkflowRun } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, "src", "autonomous-integration.mjs")).href);
            const { owner, repo } = context.repo;
            const dispatched = context.eventName === "workflow_dispatch";
            const run = context.payload.workflow_run;
            const candidateHeadSha = dispatched ? context.payload.inputs?.candidate_head_sha : run?.head_sha;
            const candidateHeadBranch = dispatched ? context.payload.inputs?.candidate_head_branch : run?.head_branch;
            if (!/^[a-f0-9]{40}$/.test(candidateHeadSha ?? "")) throw new Error("candidate-head-sha-invalid");
            if (dispatched && !candidateHeadBranch?.startsWith("feature/sovereign-")) throw new Error("candidate-head-branch-invalid");
            const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: candidateHeadSha, per_page: 100,
            });
            const candidates = associated.filter((item) => item.state === "open" && item.base.ref === "main");
            if (candidates.length === 0) {
              core.notice("No open main pull request is associated with this verified commit; integration is not applicable.");
              core.setOutput("found", "false");
              return;
            }
            if (candidates.length > 1) throw new Error(`ambiguous-open-main-prs:${candidates.length}`);
            const detail = (await github.rest.pulls.get({ owner, repo, pull_number: candidates[0].number })).data;
            if (dispatched && detail.head.sha !== candidateHeadSha) throw new Error("dispatched-head-sha-mismatch");
            if (dispatched && detail.head.ref !== candidateHeadBranch) throw new Error("dispatched-head-branch-mismatch");
            if (dispatched && detail.head.repo?.full_name !== `${owner}/${repo}`) throw new Error("dispatched-head-repository-mismatch");
            const main = (await github.rest.repos.getBranch({ owner, repo, branch: "main" })).data;
            const ancestry = await github.rest.repos.compareCommits({ owner, repo, base: main.commit.sha, head: detail.head.sha });
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: detail.number, per_page: 100 });
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, head_sha: detail.head.sha, per_page: 100,
            });
            const sovereign = detail.head.ref.startsWith("feature/sovereign-");
            const verify = sovereign
              ? latestExactWorkflowRun(runs, {
                  name: "Verify Mahoraga",
                  headSha: detail.head.sha,
                  events: ["pull_request", "workflow_dispatch"],
                  ignoredConclusions: ["action_required"],
                })
              : latestExactWorkflowRun(runs, { name: "Verify Mahoraga", headSha: detail.head.sha });
            const relay = latestExactWorkflowRun(runs, { name: "Validate Destiny Codex Relay", headSha: detail.head.sha });
            const verifySucceeded = verify?.status === "completed" && verify.conclusion === "success";
            const relaySucceeded = relay?.status === "completed" && relay.conclusion === "success";

            fs.mkdirSync("state", { recursive: true });
            fs.writeFileSync("state/autonomous-integration-input.json", JSON.stringify({
              workflow: { name: "Verify Mahoraga", conclusion: verifySucceeded ? "success" : "missing", headSha: detail.head.sha },
              pullRequest: {
                number: detail.number, state: detail.state, draft: detail.draft,
                baseRef: detail.base.ref, baseSha: detail.base.sha, currentMainSha: main.commit.sha,
                title: detail.title, headRef: detail.head.ref, headSha: detail.head.sha,
                headRepository: detail.head.repo?.full_name, baseRepository: detail.base.repo.full_name,
                mergeable: detail.mergeable === true,
                headContainsMain: ancestry.data.behind_by === 0,
                changedFiles: files.slice(0, 257).map((item) => item.filename),
                destinyRelayVerified: relaySucceeded,
              },
            }));
            core.setOutput("found", "true");

      - name: Evaluate trusted integration policy
        id: policy
        if: steps.candidate.outputs.found == 'true'
        run: node scripts/autonomous-integration.mjs --input state/autonomous-integration-input.json

  merge:
    needs: evaluate
    if: needs.evaluate.outputs.found == 'true' && needs.evaluate.outputs.eligible == 'true'
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted integration code from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Revalidate and merge exact verified head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PULL_REQUEST: ${{ needs.evaluate.outputs.pull_request }}
          VERIFIED_HEAD: ${{ needs.evaluate.outputs.head_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");
            const { pathToFileURL } = require("url");
            const workspace = process.env.GITHUB_WORKSPACE;
            const { autonomyPolicySnapshot } = await import(pathToFileURL(path.join(workspace, "src", "autonomy-policy.mjs")).href);
            const { evaluateAutonomousIntegration, latestExactWorkflowRun } = await import(pathToFileURL(path.join(workspace, "src", "autonomous-integration.mjs")).href);
            const manifest = JSON.parse(fs.readFileSync(path.join(workspace, "mahoraga.manifest.json"), "utf8"));
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PULL_REQUEST);
            const expectedHead = process.env.VERIFIED_HEAD;
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number })).data;
            const main = (await github.rest.repos.getBranch({ owner, repo, branch: "main" })).data;
            const ancestry = await github.rest.repos.compareCommits({ owner, repo, base: main.commit.sha, head: pr.head.sha });
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number, per_page: 100 });
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, head_sha: pr.head.sha, per_page: 100,
            });
            const sovereign = pr.head.ref.startsWith("feature/sovereign-");
            const verify = sovereign
              ? latestExactWorkflowRun(runs, {
                  name: "Verify Mahoraga",
                  headSha: pr.head.sha,
                  events: ["pull_request", "workflow_dispatch"],
                  ignoredConclusions: ["action_required"],
                })
              : latestExactWorkflowRun(runs, { name: "Verify Mahoraga", headSha: pr.head.sha });
            const relay = latestExactWorkflowRun(runs, { name: "Validate Destiny Codex Relay", headSha: pr.head.sha });
            const freshDecision = evaluateAutonomousIntegration({
              workflow: { name: "Verify Mahoraga", conclusion: verify?.status === "completed" && verify.conclusion === "success" ? "success" : "missing", headSha: pr.head.sha },
              pullRequest: {
                number: pr.number, state: pr.state, draft: pr.draft,
                baseRef: pr.base.ref, baseSha: pr.base.sha, currentMainSha: main.commit.sha,
                title: pr.title, headRef: pr.head.ref, headSha: pr.head.sha,
                headRepository: pr.head.repo?.full_name, baseRepository: pr.base.repo.full_name,
                mergeable: pr.mergeable === true,
                headContainsMain: ancestry.data.behind_by === 0,
                changedFiles: files.slice(0, 257).map((item) => item.filename),
                destinyRelayVerified: relay?.status === "completed" && relay.conclusion === "success",
              },
            }, autonomyPolicySnapshot(manifest));
            if (!freshDecision.eligible) throw new Error(`policy-changed-before-merge:${freshDecision.reason}`);
            if (freshDecision.headSha !== expectedHead) throw new Error("verified-head-advanced");
            const result = await github.rest.pulls.merge({ owner, repo, pull_number, sha: expectedHead, merge_method: "squash" });
            if (!result.data.merged) throw new Error(`merge-rejected:${result.data.message}`);
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: "verify.yml", ref: "main" });
