name: Deploy and Accept Exact Main on Cloudflare

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Verify Mahoraga"]
    types: [completed]
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  # Deployment publication stays serialized. Scheduled renewal runs replace stale
  # in-progress/rerun watchdogs so one queued run cannot monopolize the five-minute lane.
  group: mahoraga-cloudflare-execution-runtime-${{ github.event_name == 'schedule' && 'renewal' || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  deploy-accept:
    name: Deploy and accept exact verified main
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.actor == github.repository_owner &&
       github.repository == 'michaeljwilliams0123/mahoraga' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.repository == 'michaeljwilliams0123/mahoraga' &&
       github.event.workflow_run.name == 'Verify Mahoraga' &&
       github.event.workflow_run.path == '.github/workflows/verify.yml' &&
       github.event.workflow_run.status == 'completed' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       ((github.event.workflow_run.actor.login == github.repository_owner &&
         (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) ||
        (github.event.workflow_run.actor.login == 'github-actions[bot]' &&
         (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERIFIED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      ZERO_CREDIT_PROVIDER_TOKEN: ${{ secrets.ZERO_CREDIT_PROVIDER_TOKEN }}
      PROVIDER_REFRESH_SECRET: ${{ secrets.PROVIDER_REFRESH_SECRET }}
      ZERO_CREDIT_PROVIDER_URL: https://mahoraga-zero-credit-inference.mahoraga-mjw0123.workers.dev/

    steps:
      - name: Check out exact verified main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Mahoraga Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Fetch trusted bot publication receipt
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.actor.login == 'github-actions[bot]' &&
          github.event.workflow_run.event == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$PUBLICATION_VERIFY_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || exit 1
          artifacts_json="$RUNNER_TEMP/verified-main-publication-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLICATION_VERIFY_RUN_ID/artifacts?per_page=100" > "$artifacts_json"
          artifact_name="verified-main-publication-$VERIFIED_SHA"
          artifact_count="$(jq --arg name "$artifact_name" '[.artifacts[] | select(.name == $name && .expired == false)] | length' "$artifacts_json")"
          test "$artifact_count" = "1"
          artifact_id="$(jq -r --arg name "$artifact_name" '.artifacts[] | select(.name == $name && .expired == false) | .id' "$artifacts_json")"
          receipt_zip="$RUNNER_TEMP/verified-main-publication.zip"
          receipt_path="$RUNNER_TEMP/verified-main-publication.json"
          gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$receipt_zip"
          unzip -p "$receipt_zip" verified-main-publication.json > "$receipt_path"
          echo "VERIFIED_MAIN_PUBLICATION_RECEIPT=$receipt_path" >> "$GITHUB_ENV"

      - name: Validate canonical verification publication receipt
        if: github.event_name == 'workflow_run'
        run: node scripts/verified-main-publication.ts

      - name: Prepare ephemeral cutover paths
        shell: bash
        run: |
          set -euo pipefail
          echo "PROVIDER_SECRETS_FILE=${RUNNER_TEMP}/mahoraga-zero-credit-provider-secrets.json" >> "$GITHUB_ENV"
          echo "RUNTIME_SECRETS_FILE=${RUNNER_TEMP}/mahoraga-execution-runtime-secrets.json" >> "$GITHUB_ENV"
          echo "BILLING_ATTESTATION_FILE=${RUNNER_TEMP}/mahoraga-zero-credit-billing-attestation.json" >> "$GITHUB_ENV"

      - name: Verify exact SHA is still authoritative main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-exact-head.mjs

      - name: Require bounded Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare deployment credentials are not configured for the hosted exact-main lane."
            exit 1
          fi
          if [ -n "$CLOUDFLARE_ACCESS_TOKEN" ]; then
            if [ -n "$CLOUDFLARE_ACCESS_CLIENT_ID" ] || [ -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; then
              echo "::error::Cloudflare Access credentials are ambiguous; configure either token or service-token pair."
              exit 1
            fi
          elif [ -z "$CLOUDFLARE_ACCESS_CLIENT_ID" ] || [ -z "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::Cloudflare Access credentials are not configured for live acceptance."
            exit 1
          fi
          if [ -z "$ZERO_CREDIT_PROVIDER_TOKEN" ] || [ -z "$PROVIDER_REFRESH_SECRET" ]; then
            echo "::error::Hard-zero provider credentials are not configured for the hosted exact-main lane."
            exit 1
          fi

      - name: Prove account-level hard-zero billing and prepare provider material
        shell: bash
        run: |
          set -euo pipefail
          account_hash="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$account_hash"
          export ZERO_CREDIT_ACCOUNT_ID_HASH="$account_hash"
          echo "ZERO_CREDIT_ACCOUNT_ID_HASH=$account_hash" >> "$GITHUB_ENV"
          node scripts/cloudflare-zero-credit-attestation.mjs --output "$BILLING_ATTESTATION_FILE"
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const providerToken = (process.env.ZERO_CREDIT_PROVIDER_TOKEN ?? '').trim();
          const refreshSecret = (process.env.PROVIDER_REFRESH_SECRET ?? '').trim();
          const providerUrl = (process.env.ZERO_CREDIT_PROVIDER_URL ?? '').trim();
          const accountHash = (process.env.ZERO_CREDIT_ACCOUNT_ID_HASH ?? '').trim();
          if (providerToken.length < 32 || refreshSecret.length < 32 || !providerUrl || !accountHash) {
            throw new Error('hard-zero-provider-material-invalid');
          }
          await writeFile(
            process.env.PROVIDER_SECRETS_FILE,
            JSON.stringify({ ZERO_CREDIT_PROVIDER_TOKEN: providerToken }),
            { encoding: 'utf8', mode: 0o600 },
          );
          await writeFile(
            process.env.RUNTIME_SECRETS_FILE,
            JSON.stringify({
              PROVIDER_REFRESH_SECRET: refreshSecret,
              ZERO_CREDIT_PROVIDER_URL: providerUrl,
              ZERO_CREDIT_PROVIDER_TOKEN: providerToken,
              ZERO_CREDIT_ACCOUNT_ID_HASH: accountHash,
            }),
            { encoding: 'utf8', mode: 0o600 },
          );
          NODE

      - name: Deploy isolated budgeted Workers AI provider
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.1 deploy \
            --config deploy/cloudflare-zero-credit-inference/wrangler.jsonc \
            --var "TARGET_SHA:${VERIFIED_SHA}" \
            --var "ZERO_CREDIT_ACCOUNT_ID_HASH:${ZERO_CREDIT_ACCOUNT_ID_HASH}" \
            --secrets-file "$PROVIDER_SECRETS_FILE"

      - name: Deploy private universal execution broker
        run: npm run cloudflare:execution-broker:deploy

      - name: Deploy exact verified execution runtime
        run: node scripts/cloudflare-execution-runtime.ts deploy --sha "$VERIFIED_SHA" --secrets-file "$RUNTIME_SECRETS_FILE"

      - name: Refresh hard-zero provider admission
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const billingAttestation = await readFile(process.env.BILLING_ATTESTATION_FILE, 'utf8');
          const headers = new Headers({
            'cache-control': 'no-store',
            'content-type': 'application/json',
            'x-provider-refresh-token': process.env.PROVIDER_REFRESH_SECRET,
          });
          const token = (process.env.CLOUDFLARE_ACCESS_TOKEN ?? '').trim();
          const clientId = (process.env.CLOUDFLARE_ACCESS_CLIENT_ID ?? '').trim();
          const clientSecret = (process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET ?? '').trim();
          if (token) headers.set('cf-access-token', token);
          else {
            headers.set('cf-access-client-id', clientId);
            headers.set('cf-access-client-secret', clientSecret);
          }
          const response = await fetch('https://mahoraga-execution-runtime.mahoraga-mjw0123.workers.dev/api/provider/refresh', {
            method: 'POST', headers, body: JSON.stringify({ billingAttestation }), redirect: 'manual',
          });
          const body = await response.json().catch(() => ({}));
          if (response.status !== 200 || body.zeroCreditEligible !== true) {
            throw new Error(`provider-admission-${response.status}:${String(body.reasonCode ?? 'unverified')}:${JSON.stringify(body.diagnostics ?? null)}`);
          }
          process.stdout.write(`${JSON.stringify({
            status: 'provider-admitted',
            providerId: body.providerId,
            zeroCreditEligible: true,
            verifiedAt: body.verifiedAt,
            canaryExpiresAt: body.canaryExpiresAt,
          })}\n`);
          NODE

      - name: Deploy exact verified owner gateway
        run: npm run cloudflare:owner-gateway:deploy

      - name: Prove Access, provenance, Cloudflare cognition, replay, and no Railway fallthrough
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          node scripts/cloudflare-production-acceptance.ts \
            --sha "$VERIFIED_SHA" \
            --idempotency-key "cutover-${VERIFIED_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --redeploy-secrets-file "$RUNTIME_SECRETS_FILE" \
            --billing-attestation-file "$BILLING_ATTESTATION_FILE" \
            --receipt reports/cloudflare-execution-runtime-acceptance.json
          {
            echo '### Cloudflare execution-runtime acceptance'
            echo '```json'
            cat reports/cloudflare-execution-runtime-acceptance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain sanitized Cloudflare acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-execution-runtime-acceptance-${{ env.VERIFIED_SHA }}
          path: reports/cloudflare-execution-runtime-acceptance.json
          retention-days: 7
          if-no-files-found: error

      - name: Remove temporary Cloudflare secret files
        if: always()
        shell: bash
        run: rm -f "$PROVIDER_SECRETS_FILE" "$RUNTIME_SECRETS_FILE" "$BILLING_ATTESTATION_FILE"

  renew-provider-admission:
    name: Renew hard-zero provider admission evidence
    if: github.event_name == 'schedule' && github.repository == 'michaeljwilliams0123/mahoraga'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERIFIED_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_BILLING_READ_TOKEN: ${{ secrets.CLOUDFLARE_BILLING_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      PROVIDER_REFRESH_SECRET: ${{ secrets.PROVIDER_REFRESH_SECRET }}
      RENEWAL_MARGIN_MS: 1800000

    steps:
      - name: Check out scheduled authoritative main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use Mahoraga Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Prepare ephemeral renewal path
        shell: bash
        run: |
          set -euo pipefail
          echo "BILLING_ATTESTATION_FILE=${RUNNER_TEMP}/mahoraga-zero-credit-billing-attestation.json" >> "$GITHUB_ENV"

      - name: Verify scheduled SHA is still authoritative main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-exact-head.mjs

      - name: Require bounded renewal credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$PROVIDER_REFRESH_SECRET" ]; then
            echo "::error::Hard-zero renewal credentials are not configured."
            exit 1
          fi
          if [ -n "$CLOUDFLARE_ACCESS_TOKEN" ]; then
            if [ -n "$CLOUDFLARE_ACCESS_CLIENT_ID" ] || [ -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; then
              echo "::error::Cloudflare Access credentials are ambiguous; configure either token or service-token pair."
              exit 1
            fi
          elif [ -z "$CLOUDFLARE_ACCESS_CLIENT_ID" ] || [ -z "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::Cloudflare Access credentials are not configured for admission renewal."
            exit 1
          fi

      - name: Inspect current provider freshness margin
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const headers = new Headers({ 'cache-control': 'no-store' });
          const token = (process.env.CLOUDFLARE_ACCESS_TOKEN ?? '').trim();
          const clientId = (process.env.CLOUDFLARE_ACCESS_CLIENT_ID ?? '').trim();
          const clientSecret = (process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET ?? '').trim();
          if (token) headers.set('cf-access-token', token);
          else {
            headers.set('cf-access-client-id', clientId);
            headers.set('cf-access-client-secret', clientSecret);
          }
          const response = await fetch('https://mahoraga-execution-runtime.mahoraga-mjw0123.workers.dev/api/runtime/attestation', {
            method: 'GET', headers, redirect: 'manual',
          });
          const body = await response.json().catch(() => ({}));
          if ((response.status !== 200 && response.status !== 503) || body.targetSha !== process.env.VERIFIED_SHA) {
            throw new Error(`provider-freshness-authority-${response.status}:${String(body.targetSha ?? 'unverified')}`);
          }
          const provider = body.provider && typeof body.provider === 'object' ? body.provider : {};
          if (provider.providerId !== 'cloudflare-workers-ai') throw new Error('provider-freshness-identity-unverified');
          const now = Date.now();
          const margin = Number(process.env.RENEWAL_MARGIN_MS);
          const verifiedAt = provider.verifiedAt;
          const canaryExpiresAt = provider.canaryExpiresAt;
          const freshEnough = body.status === 'ready'
            && provider.admitted === true
            && provider.zeroCreditEligible === true
            && Number.isSafeInteger(verifiedAt)
            && Number.isSafeInteger(canaryExpiresAt)
            && verifiedAt <= now
            && canaryExpiresAt > now + margin;
          const renewalRequired = !freshEnough;
          appendFileSync(process.env.GITHUB_OUTPUT, `renewal_required=${renewalRequired}\n`);
          process.stdout.write(`${JSON.stringify({
            status: renewalRequired ? 'provider-renewal-required' : 'provider-freshness-sufficient',
            targetSha: body.targetSha,
            providerId: provider.providerId,
            verifiedAt: Number.isSafeInteger(verifiedAt) ? verifiedAt : null,
            canaryExpiresAt: Number.isSafeInteger(canaryExpiresAt) ? canaryExpiresAt : null,
            remainingMs: Number.isSafeInteger(canaryExpiresAt) ? canaryExpiresAt - now : null,
            renewalMarginMs: margin,
          })}\n`);
          NODE

      - name: Re-prove account-level hard-zero billing
        if: steps.freshness.outputs.renewal_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          account_hash="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$account_hash"
          export ZERO_CREDIT_ACCOUNT_ID_HASH="$account_hash"
          node scripts/cloudflare-zero-credit-attestation.mjs --output "$BILLING_ATTESTATION_FILE"

      - name: Renew provider admission without deployment
        if: steps.freshness.outputs.renewal_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const billingAttestation = await readFile(process.env.BILLING_ATTESTATION_FILE, 'utf8');
          const headers = new Headers({
            'cache-control': 'no-store',
            'content-type': 'application/json',
            'x-provider-refresh-token': process.env.PROVIDER_REFRESH_SECRET,
          });
          const token = (process.env.CLOUDFLARE_ACCESS_TOKEN ?? '').trim();
          const clientId = (process.env.CLOUDFLARE_ACCESS_CLIENT_ID ?? '').trim();
          const clientSecret = (process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET ?? '').trim();
          if (token) headers.set('cf-access-token', token);
          else {
            headers.set('cf-access-client-id', clientId);
            headers.set('cf-access-client-secret', clientSecret);
          }
          const response = await fetch('https://mahoraga-execution-runtime.mahoraga-mjw0123.workers.dev/api/provider/refresh', {
            method: 'POST', headers, body: JSON.stringify({ billingAttestation }), redirect: 'manual',
          });
          const body = await response.json().catch(() => ({}));
          if (response.status !== 200 || body.zeroCreditEligible !== true) {
            throw new Error(`provider-admission-renewal-${response.status}:${String(body.reasonCode ?? 'unverified')}:${JSON.stringify(body.diagnostics ?? null)}`);
          }
          process.stdout.write(`${JSON.stringify({
            status: 'provider-admission-renewed',
            providerId: body.providerId,
            zeroCreditEligible: true,
            verifiedAt: body.verifiedAt,
            canaryExpiresAt: body.canaryExpiresAt,
          })}\n`);
          NODE

      - name: Remove temporary billing attestation
        if: always()
        shell: bash
        run: rm -f "$BILLING_ATTESTATION_FILE"
