name: Mahoraga cloud workspace task
description: Share bounded repository work and repository-safe attachments through GitHub.
title: "[MAHORAGA] "
labels:
  - privacy:repo-only
body:
  - type: markdown
    attributes:
      value: |
        This form is the authenticated write and attachment surface for the Mahoraga Cloud Workspace.

        It does **not** automatically invoke a model. After reviewing the submitted task, the repository owner may explicitly delegate it to Codex with an owner-authored `@codex` command. Use only repository-safe context: no chats, credentials, personal documents, browser history, raw plugin responses, or unrelated files.
  - type: input
    id: idempotency_key
    attributes:
      label: Idempotency key
      description: Optional stable identifier for retries. Leave blank and the owner will assign one during validated dispatch.
      placeholder: mahoraga-feature-v1
  - type: input
    id: base_commit
    attributes:
      label: Base commit
      description: Optional immutable commit SHA. Leave blank to let the owner pin the current main revision during validated dispatch.
  - type: textarea
    id: task
    attributes:
      label: Bounded task
      description: Paste the task copied by the Cloud Workspace. Describe an observable repository outcome without chat or personal context.
    validations:
      required: true
  - type: dropdown
    id: tool_profile
    attributes:
      label: Tool profile
      description: The preferred bounded capability set. The executing Codex still follows AGENTS.md and the allowed paths.
      options:
        - Auto-route within repository
        - Repository engineer
        - UI and frontend
        - Security review
        - Testing and verification
        - Documentation
      default: 0
    validations:
      required: true
  - type: dropdown
    id: integration_mode
    attributes:
      label: Integration mode
      description: Both authorized Codex instances may merge when explicitly permitted.
      options:
        - Pull request for review
        - Merge after verification
      default: 0
    validations:
      required: true
  - type: textarea
    id: allowed_paths
    attributes:
      label: Allowed paths
      description: One repository-relative path or directory per line.
      placeholder: |
        src
        test
        docs
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification commands
      description: One deterministic command per line.
      placeholder: npm run verify
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions the Primary Codex must verify before merge.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Repository-safe attachments
      description: Drag files or paste images here. GitHub owns the upload and authentication. Attachments inherit repository visibility; never upload private chats, credentials, personal documents, or unrelated files.
      placeholder: Paste an image or drag a repository-safe reference file into this box.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This task and every attachment contain no chat transcript, credential, personal document, raw plugin response, or unrelated context.
          required: true
        - label: I understand that opening this issue does not spend model credits; the repository owner explicitly invokes Codex after review.
          required: true
