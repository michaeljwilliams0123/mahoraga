name: Validate Destiny Codex Relay

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: destiny-codex-relay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  envelope:
    name: Destiny relay envelope
    if: startsWith(github.event.pull_request.title, '[DESTINY-CODEX]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted validator from base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted

      - name: Check out candidate from head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Validate immutable dispatch envelope and changed paths
        id: relay
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node trusted/scripts/destiny-codex-dispatch.mjs validate-pr --root candidate

      - name: Publish content-free relay receipt
        shell: bash
        env:
          DISPATCH_ID: ${{ steps.relay.outputs.dispatch_id }}
          REQUEST_HASH: ${{ steps.relay.outputs.short_request_hash }}
          FILE_COUNT: ${{ steps.relay.outputs.implementation_file_count }}
        run: |
          {
            echo "## Destiny Codex relay"
            echo
            printf 'Validated `%s` · request `%s` · %s implementation file(s).\n' "$DISPATCH_ID" "$REQUEST_HASH" "$FILE_COUNT"
            echo
            echo 'This check validates the GitHub envelope. A separate `[DESTINY-CODEX:ACK]` comment proves the event-triggered Codex run received it.'
          } >> "$GITHUB_STEP_SUMMARY"
