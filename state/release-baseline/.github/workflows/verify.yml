name: Verify Mahoraga

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mahoraga-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Verify conversation and evolution contracts
        run: npm run verify:conversation-plane

      - name: Verify authoritative repository
        run: npm run verify

      - name: Validate static self-upgrade policy
        run: npm run self-upgrade:validate

      - name: Render declared capability gap audit
        run: npm run gap:audit

      - name: Publish GitHub assurance dashboard
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: node scripts/github-audit.mjs --format markdown >> "$GITHUB_STEP_SUMMARY"

  workspace:
    name: Verify unified Vercel workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloud-app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloud-app/package-lock.json

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Type-check, test, and build the single UI
        run: npm run verify

  dispatch-sovereign-integration:
    needs: [verify, workspace]
    if: >-
      success() &&
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref_name, 'feature/sovereign-')
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact sovereign head to trusted integration
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CANDIDATE_HEAD_SHA: ${{ github.sha }}
          CANDIDATE_HEAD_BRANCH: ${{ github.ref_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "autonomous-integration.yml",
              ref: "main",
              inputs: {
                candidate_head_sha: process.env.CANDIDATE_HEAD_SHA,
                candidate_head_branch: process.env.CANDIDATE_HEAD_BRANCH,
              },
            });
