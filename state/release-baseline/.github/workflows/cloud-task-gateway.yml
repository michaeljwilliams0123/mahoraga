name: Mahoraga Cloud Task Gateway

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing owner-authored Mahoraga issue number
        required: true
        type: string
      command:
        description: Exact bounded dispatch command for the issue
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: mahoraga-cloud-gateway-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate owner approval and dispatch
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint existing GitHub App PR publication token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MAHORAGA_GITHUB_APP_ID }}
          private-key: ${{ secrets.MAHORAGA_GITHUB_APP_PRIVATE_KEY }}
          repositories: mahoraga
          permission-contents: write
          permission-pull-requests: write

      - name: Check out authoritative main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Use Mahoraga Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Build owner-approved issue event
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          COMMAND: ${{ inputs.command }}
          EVENT_FILE: ${{ runner.temp }}/mahoraga-owner-dispatch-event.json
        with:
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            if (!Number.isSafeInteger(issue_number) || issue_number < 1) {
              core.setFailed("issue_number must be a positive integer");
              return;
            }
            const command = String(process.env.COMMAND ?? "").trim();
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            if (issue.pull_request) {
              core.setFailed("Mahoraga dispatch requires an issue, not a pull request");
              return;
            }
            const event = {
              action: "created",
              repository: { full_name: `${owner}/${repo}`, owner: { login: owner } },
              sender: { login: owner },
              issue,
              comment: {
                body: command,
                user: { login: owner },
                author_association: "OWNER",
              },
            };
            fs.writeFileSync(process.env.EVENT_FILE, JSON.stringify(event));

      - name: Parse and validate owner-approved issue
        id: gateway
        shell: bash
        env:
          RESULT_FILE: ${{ runner.temp }}/mahoraga-gateway.json
          EVENT_FILE: ${{ runner.temp }}/mahoraga-owner-dispatch-event.json
        run: |
          set -euo pipefail
          node scripts/cloud-task-gateway.mjs dispatch \
            --event "$EVENT_FILE" \
            --base-commit "$(git rev-parse HEAD)" > "$RESULT_FILE"
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, "utf8"));
            for (const key of ["mode", "recordId", "recordPath", "changed", "issueNumber", "attachmentReferenceCount"]) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${result[key]}\n`);
            }
          '

      - name: Validate coordination ledgers
        run: |
          node scripts/coordination.mjs validate
          node scripts/codex-cloud-task.mjs dispatch-bundle > /dev/null

      # PR handoff replaces direct-main mutations; native receiver acts only on merged main.
      - name: Stage validated dispatch through protected pull request
        id: publish
        shell: bash
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          MODE: ${{ steps.gateway.outputs.mode }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "Mahoraga Cloud Gateway"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- coordination/assignments coordination/cloud-tasks
          if ! git diff --cached --quiet; then
            current_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
            test "$(git rev-parse HEAD)" = "$current_main" || {
              echo "::error::main moved during dispatch; retry from exact current source."
              exit 1
            }
            branch="feature/gateway-dispatch-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
            git switch -c "$branch"
            git commit -m "[CONTROL] Dispatch ${MODE} from issue #${ISSUE_NUMBER}"
            node scripts/coordination.mjs validate
            node scripts/codex-cloud-task.mjs dispatch-bundle > /dev/null
            git push origin "HEAD:refs/heads/${branch}"
            pr_url="$(gh pr create --base main --head "$branch" --title "chore(gateway): stage bounded ${MODE} dispatch from issue #${ISSUE_NUMBER}" --body "Native protected dispatch handoff for issue #${ISSUE_NUMBER}. Receiver execution begins only after exact-head Verify and protected merge to main. No paid inference or direct-main mutation.")"
            echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
            echo "state=awaiting-protected-merge" >> "$GITHUB_OUTPUT"
          else
            echo "state=already-recorded" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Label and acknowledge accepted dispatch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          MODE: ${{ steps.gateway.outputs.mode }}
          RECORD_ID: ${{ steps.gateway.outputs.recordId }}
          RECORD_PATH: ${{ steps.gateway.outputs.recordPath }}
          CHANGED: ${{ steps.gateway.outputs.changed }}
          COMMIT: ${{ steps.publish.outputs.commit }}
          ATTACHMENT_COUNT: ${{ steps.gateway.outputs.attachmentReferenceCount }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
          PUBLICATION_STATE: ${{ steps.publish.outputs.state }}
          RECEIVER_STATE: ${{ steps.workspace_receiver.outputs.state }}
          RECEIVER_OUTCOME: ${{ steps.workspace_receiver.outcome }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const mode = process.env.MODE;
            const labels = [
              { name: "mahoraga:queued", color: "0e8a16", description: "Bounded dispatch waiting for protected PR" },
              mode === "codex"
                ? { name: "lane:codex-cloud", color: "1d76db", description: "Explicit Codex cloud execution lane" }
                : { name: "lane:desktop", color: "d876e3", description: "Outbound desktop Codex execution lane" },
            ];
            for (const label of labels) {
              try { await github.rest.issues.getLabel({ owner, repo, name: label.name }); }
              catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: labels.map((item) => item.name) });
            const state = process.env.CHANGED === "true" ? "created" : "reused idempotently";
            const attachments = Number(process.env.ATTACHMENT_COUNT) > 0
              ? ` ${process.env.ATTACHMENT_COUNT} attachment reference(s) remain in this source issue and were not copied into the coordination record.`
              : "";
            const receiver = mode === "desktop" ? " Receiver will consume the assignment after the protected merge." : "";
            const pr = process.env.PR_URL ? ` Protected PR: ${process.env.PR_URL}.` : "";
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `Mahoraga ${state} the bounded **${mode}** dispatch \`${process.env.RECORD_ID}\` at \`${process.env.COMMIT.slice(0, 12)}\`. State: **${process.env.PUBLICATION_STATE}**.${pr}${receiver}${attachments}\n\nDeterministic validation is complete. Model execution is not activated until protected merge.`,
            });

      - name: Report rejected dispatch without echoing issue content
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `Mahoraga rejected this dispatch before model execution. No execution record was activated. Review the bounded workflow evidence: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
