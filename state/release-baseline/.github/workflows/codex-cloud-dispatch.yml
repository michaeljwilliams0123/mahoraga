name: Dispatch Codex Cloud tasks

on:
  push:
    branches: [main]
    paths:
      - coordination/cloud-tasks/*.json
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: mahoraga-codex-cloud-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate and dispatch bounded tasks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const output = await exec.getExecOutput(
              "node",
              ["scripts/codex-cloud-task.mjs", "dispatch-bundle"],
              { silent: true }
            );
            if (output.exitCode !== 0) {
              core.setFailed("Mahoraga rejected the Codex Cloud task mailbox.");
              return;
            }
            const bundle = JSON.parse(output.stdout);
            const { owner, repo } = context.repo;
            const requiredLabels = [
              { name: "codex:queued", color: "1d76db", description: "Validated task staged for a Primary-authored PR comment" },
              { name: "privacy:repo-only", color: "5319e7", description: "Repository-only context; no chats or credentials" },
              { name: "codex:pr-comment-required", color: "fbca04", description: "Primary must place the bounded @codex task on a pull request" },
              { name: "codex:draft-required", color: "d4c5f9", description: "Deterministic draft activation PR has not been staged" },
              { name: "codex:activation-ready", color: "0e8a16", description: "Draft PR is ready for an owner-authored Codex mention" },
              { name: "codex:blocked", color: "b60205", description: "Primary task reached a terminal blocker" },
              { name: "codex:done", color: "006b75", description: "Primary task completed with verified return evidence" },
            ];
            for (const label of requiredLabels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }
            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "all",
              per_page: 100,
            });
            for (const task of bundle.tasks) {
              const taskMarker = `task-id=${task.taskId}`;
              const idempotencyMarker = `idempotency-key=${task.idempotencyKey}`;
              let issue = existingIssues.find((issue) =>
                !issue.pull_request &&
                issue.body?.includes(taskMarker) &&
                issue.body?.includes(idempotencyMarker)
              );
              if (!issue) {
                const created = await github.rest.issues.create({
                  owner,
                  repo,
                  title: task.issue.title,
                  body: task.issue.body.replace(/^@codex\s*/i, ""),
                  labels: [...task.issue.labels, "codex:pr-comment-required", "codex:draft-required"],
                });
                issue = created.data;
                existingIssues.push(issue);
                core.notice(`Staged issue #${issue.number} for ${task.taskId}; no model was invoked.`);
              }
              const labelNames = (issue.labels ?? []).map((label) => typeof label === "string" ? label : label.name);
              if (labelNames.some((name) => name === "codex:done" || name === "codex:blocked")) {
                core.notice(`Task ${task.taskId} already has a terminal issue state.`);
                continue;
              }

              const branch = `codex-dispatch/${task.taskId}`;
              if (!/^[a-f0-9]{40}$/.test(context.sha)) throw new Error("dispatch-head-invalid");
              try {
                await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: context.sha });
              }

              const pulls = await github.rest.pulls.list({ owner, repo, state: "all", head: `${owner}:${branch}`, per_page: 10 });
              const openPull = pulls.data.find((candidate) => candidate.state === "open");
              const mergedPull = pulls.data.find((candidate) => Boolean(candidate.merged_at));
              if (openPull) {
                if (!labelNames.includes("codex:activation-ready")) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: `Draft activation PR #${openPull.number} is ready. No model was invoked. The repository owner must place the connected Codex mention and this issue's validated task body in a new comment on that PR.`,
                  });
                }
                try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: "codex:draft-required" }); }
                catch (error) { if (error.status !== 404) throw error; }
                await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ["codex:activation-ready"] });
                core.notice(`Reused open activation PR #${openPull.number} for ${task.taskId}.`);
                continue;
              }
              if (mergedPull) {
                core.notice(`Task ${task.taskId} already has merged activation PR #${mergedPull.number}.`);
                continue;
              }

              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ["codex:draft-required"] });
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: "codex:activation-ready" }); }
              catch (error) { if (error.status !== 404) throw error; }

              const activationPath = `coordination/codex-activations/${task.taskId}.json`;
              const activationSource = `${JSON.stringify(task.activation, null, 2)}\n`;
              let activationExists = false;
              try {
                const current = await github.rest.repos.getContent({ owner, repo, path: activationPath, ref: branch });
                if (Array.isArray(current.data) || current.data.type !== "file") throw new Error("activation-path-invalid");
                const observed = Buffer.from(current.data.content, "base64").toString("utf8");
                if (observed !== activationSource) throw new Error("activation-content-conflict");
                activationExists = true;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              if (!activationExists) {
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: activationPath,
                  branch,
                  message: `[CONTROL] Stage ${task.taskId}`,
                  content: Buffer.from(activationSource, "utf8").toString("base64"),
                });
              }

              const pull = (await github.rest.pulls.create({
                owner,
                repo,
                title: task.issue.title,
                head: branch,
                base: "main",
                draft: true,
                body: [
                  `Deterministic activation for #${issue.number}. No model has been invoked.`,
                  "",
                  `Activation pointer: \`${activationPath}\``,
                  "",
                  "Owner activation: add the connected Codex account mention as the first token of a new pull-request comment, then paste the validated body from the staging issue.",
                  "The implementation worker must remove the activation pointer before returning the completed diff.",
                  "If the primary lane returns a terminal blocker, the owner may use the same source issue's bounded fallback command for the registered Secondary Codex task area.",
                ].join("\n"),
              })).data;
              await github.rest.issues.addLabels({ owner, repo, issue_number: pull.number, labels: ["codex:pr-comment-required", "privacy:repo-only"] });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Draft activation PR #${pull.number} is ready. No model was invoked. The repository owner must place the connected Codex mention and this issue's validated task body in a new comment on that PR.`,
              });
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: "codex:draft-required" }); }
              catch (error) { if (error.status !== 404) throw error; }
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ["codex:activation-ready"] });
            }
