name: Publish Staged Mahoraga Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        default: beta
        options:
          - beta
          - stable
  workflow_run:
    workflows: ["Verify Mahoraga"]
    types: [completed]


permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: mahoraga-release-${{ github.event_name == 'workflow_run' && 'automatic' || inputs.channel }}
  cancel-in-progress: false

jobs:
  release:
    name: Attest and publish exact verified update
    if: (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Mahoraga Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Verify authoritative release source
        if: github.event_name == 'workflow_dispatch'
        run: npm run verify

      - name: Build immutable update archive and manifest
        id: package
        shell: bash
        env:
          CHANNEL: ${{ github.event_name == 'workflow_run' && 'beta' || inputs.channel }}
        run: |
          set -euo pipefail
          base_version="$(node -p 'require("./mahoraga.manifest.json").version')"
          if [ "$CHANNEL" = "stable" ]; then version="$base_version"; else version="${base_version}-beta.${GITHUB_RUN_NUMBER}"; fi
          tag="v${version}"
          commit="$(git rev-parse HEAD)"
          mkdir -p dist
          artifact="dist/mahoraga-${version}.zip"
          relay_artifact="dist/mahoraga-relay-${version}.zip"
          git archive --format=zip --prefix="mahoraga-${version}/" --output="$artifact" "$commit"
          git archive --format=zip --prefix="mahoraga-relay-${version}/" --output="$relay_artifact" "$commit" relay/core.mjs relay/cloudflare-worker.mjs docs/DESTINY-CODEX-RELAY.md
          node scripts/update-manifest.mjs create \
            --artifact "$artifact" \
            --version "$version" \
            --channel "$CHANNEL" \
            --tag "$tag" \
            --commit "$commit" \
            --output dist/mahoraga-update.json
          node scripts/update-manifest.mjs validate --file dist/mahoraga-update.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "relay_artifact=$relay_artifact" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.relay_artifact }}
            dist/mahoraga-update.json

      - name: Publish staged GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.event_name == 'workflow_run' && 'beta' || inputs.channel }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
          RELAY_ARTIFACT: ${{ steps.package.outputs.relay_artifact }}
          COMMIT: ${{ steps.package.outputs.commit }}
        run: |
          set -euo pipefail
          flags=(--target "$COMMIT" --title "Mahoraga ${VERSION}" --notes "Verified ${CHANNEL} update. Eligible for verified local rollout with mandatory rollback evidence.")
          if [ "$CHANNEL" = "beta" ]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          gh release create "$TAG" "$ARTIFACT" "$RELAY_ARTIFACT" dist/mahoraga-update.json "${flags[@]}"
