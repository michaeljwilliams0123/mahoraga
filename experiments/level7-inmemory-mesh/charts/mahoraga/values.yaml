# EXPERIMENT ONLY — minimal values for Level 7 in-memory mesh chart stubs.
# Not a production Mahoraga Helm release.

nameOverride: mahoraga-l7-experiment
fullnameOverride: mahoraga-l7-experiment

inmemoryGit:
  image: codeberg.org/forgejo/forgejo:8
  tmpfsSize: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  probes:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

backup:
  # When true, create backup PVC and mount it for snapshot persist (tmpfs /data stays volatile).
  enabled: true
  storage: 5Gi
  storageClassName: ""
  mountPath: /data/mahoraga-snapshots

# Local SLM / Ollama hooks are intentionally omitted from this scaffold.
experiment:
  label: level7-inmemory-mesh
  production: false
